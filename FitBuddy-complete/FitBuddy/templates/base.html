<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitBuddy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">FitBuddy</a>
    <nav>
        <a href="/">Create plan</a>
        <a href="/docs">API docs</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer>
    <p>FitBuddy provides general wellness information and is not a substitute for professional medical advice.</p>
</footer>
</body>
</html>
